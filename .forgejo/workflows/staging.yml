# Goes into the GitHub deployment repo at .forgejo/workflows/staging.yml.
#
# It has to live in the GitHub repo rather than being added inside Forgejo: a
# Forgejo pull-mirror is read-only, so every file it runs must arrive through
# the mirror. That suits the "GitHub stays primary" topology — the deploy
# definition stays publicly reviewable, and Forgejo contributes only the runner
# and the secrets.
#
# Differences from .github/workflows/staging.yml, all forced by Forgejo:
#   - runs-on: deploy         (label of the Forgejo runner, not `self-hosted`)
#   - no permissions: block   (Forgejo has no GITHUB_TOKEN permission model)
#   - no upload-sarif         (Forgejo has no Security tab; SARIF becomes an artifact)
#   - no tool install steps   (baked into the job image — see job-image/Dockerfile)
name: CD - Staging Deployment (Forgejo)

# Manual dispatch only. Every recent staging run upstream was a
# workflow_dispatch anyway, and Forgejo does not reliably fire Actions on
# pull-mirror sync — so this matches how the team already works instead of
# fighting the mirror.
#
# `mode` defaults to plan so a mis-click cannot change infrastructure. Plan mode
# still exercises everything that matters — job dispatch, the baked image,
# checkout, all six secrets, and a real Keystone authentication (plan refreshes
# state) — it just stops before anything is created or modified.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = stop before any change; apply = full deploy"
        type: choice
        options: [plan, apply]
        default: plan
        required: true

jobs:
  deploy:
    name: Staging Deploy
    runs-on: deploy
    env:
      OS_AUTH_URL: ${{ secrets.STAGING_OS_AUTH_URL }}
      OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.STAGING_OS_APPLICATION_CREDENTIAL_ID }}
      OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.STAGING_OS_APPLICATION_CREDENTIAL_SECRET }}
      OS_REGION_NAME: ${{ secrets.STAGING_OS_REGION_NAME }}
      # Read by the pg backend in envs/staging/backend.tf. Passed via the
      # environment so the password never appears in a .tf file or in the
      # terraform init command line.
      PG_CONN_STR: ${{ secrets.PG_CONN_STR }}
      # Overrides roles_path from infrastructure/ansible/ansible.cfg so the
      # roles baked into the image are found without a galaxy install.
      ANSIBLE_ROLES_PATH: /opt/ansible-roles
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Cheap canary: if the job image is wrong or a tool is missing, fail here
      # rather than twenty minutes into a terraform apply.
      - name: Tool versions
        run: |
          terraform version
          ansible --version | head -1
          trivy --version

      - name: Terraform Format Check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      # Staging is intentionally non-blocking: surfaces HIGH/CRITICAL IaC
      # findings without halting deploys.
      - name: Terraform Security Scan (Trivy)
        continue-on-error: true
        run: trivy config --severity HIGH,CRITICAL infrastructure/terraform

      # The GitHub version uploaded this to the Security tab. Forgejo has no
      # equivalent, so the SARIF is kept as a build artifact instead — findings
      # stay retrievable per run, just not aggregated across runs.
      - name: Terraform Security Scan (Trivy, SARIF)
        if: always()
        run: |
          trivy config --severity HIGH,CRITICAL \
            --format sarif --output trivy-iac.sarif infrastructure/terraform

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: trivy-iac-staging
          path: trivy-iac.sarif

      - name: Set up SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # printf preserves the multi-line PEM newlines; quoting the env var
          # keeps the key out of the rendered script text.
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/openstack-key
          chmod 600 ~/.ssh/openstack-key
          # Derive the matching public key and hand it to Terraform so the
          # OpenStack keypair always matches this private key.
          # -P '' forces an empty passphrase: passphrase-protected keys fail
          # fast with a clear error instead of hanging on /dev/tty in CI.
          ssh-keygen -y -P '' -f ~/.ssh/openstack-key > ~/.ssh/openstack-key.pub
          echo "TF_VAR_ssh_public_key=$(cat ~/.ssh/openstack-key.pub)" >> "$GITHUB_ENV"

      # backend.tf writes state to /var/lib/tf-state/staging/terraform.tfstate.
      # That path is a named docker volume mounted by the runner
      # (runner/config.yml, container.options) — job containers are destroyed
      # after each run, so without it the state would be lost every time.
      - name: Terraform Init, Validate & Plan
        working-directory: infrastructure/terraform/envs/staging
        run: |
          terraform init
          terraform validate
          terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.mode == 'apply'
        working-directory: infrastructure/terraform/envs/staging
        run: |
          terraform apply tfplan
          echo "VM_IP=$(terraform output -raw vm_ip)" >> "$GITHUB_ENV"

      - name: Generate Ansible Inventory
        if: github.event.inputs.mode == 'apply'
        working-directory: infrastructure/ansible
        run: |
          # Empty here means terraform produced no output, and ansible-playbook
          # would still exit 0 with "no hosts matched" - a green run that
          # deployed nothing.
          if [ -z "$VM_IP" ]; then
            echo "VM_IP is empty - terraform output produced nothing" >&2
            exit 1
          fi
          # The address goes in ansible_host behind an alias rather than being
          # the host name itself. Brackets around an IPv6 literal do not work:
          # the ini plugin reads [...] as a host range pattern and fails with
          # "host range must be begin:end". An alias sidesteps the question and
          # is identical for IPv4 and IPv6.
          cat > inventory.ini <<EOF
          [docker_vm]
          staging ansible_host=${VM_IP} ansible_user=ubuntu
          EOF
          echo "Inventory:" && cat inventory.ini

      - name: Run Ansible Playbook
        if: github.event.inputs.mode == 'apply'
        working-directory: infrastructure/ansible
        run: |
          ansible-playbook -i inventory.ini \
            --private-key ~/.ssh/openstack-key staging.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          ANSIBLE_FORCE_COLOR: 'True'
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}

      - name: Cleanup Sensitive Files
        if: always()
        run: |
          rm -f ~/.ssh/openstack-key ~/.ssh/openstack-key.pub
          rm -f infrastructure/ansible/inventory.ini
          echo "Sensitive deployment artifacts removed."
