---
- name: 2. CONFIGURE Docker and Deploy Application on Staging Environment
  hosts: docker_vm
  become: yes
  gather_facts: yes

  vars:
    docker_users: ["ubuntu"]
    docker_install_compose: true
    project_root: "/home/ubuntu/app"
    local_compose_path: "{{ playbook_dir }}/../../"

  pre_tasks:
    - name: Verzeichnis für App erstellen
      ansible.builtin.file:
        path: "{{ project_root }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

  roles:
    - role: geerlingguy.docker
      tags: [docker_install]

  tasks:
    - name: Docker-Compose Datei kopieren
      ansible.posix.synchronize:
        src: "{{ local_compose_path }}"
        dest: "{{ project_root }}"
        recursive: yes
        delete: yes
        rsync_opts:
          - "--exclude=.ssh"
          - "--exclude=.git"
          - "--exclude=.history"
          - "--exclude=docker-compose.override.yml"
          - "--exclude=node_modules"
          - "--exclude=__pycache__"
          - "--exclude=.venv"
          - "--exclude=.terraform"
          - "--exclude=frontend/dist"
          - "--exclude=frontend/test-results"
          - "--exclude=frontend/blob-report"
          - "--exclude=.DS_Store"
          - "--exclude=*.pyc"
          - "--exclude=.env"

    - name: .env auf VM schreiben
      ansible.builtin.copy:
        content: "{{ lookup('env', 'STAGING_ENV_FILE') }}"
        dest: "{{ project_root }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: APP_BASE_URL aus .env lesen
      ansible.builtin.shell:
        cmd: |
          grep -E '^APP_BASE_URL=' "{{ project_root }}/.env" \
            | head -n1 | cut -d= -f2- | tr -d '"'"'"'\r'
        executable: /bin/bash
      register: app_base_url_raw
      changed_when: false

    # Kein Schritt für ein selbstsigniertes Zertifikat mehr: Caddy holt sich
    # eines vom ACME-Endpunkt der DHBW und erneuert es selbst. Das alte
    # openssl-Zertifikat lautete ohnehin auf die IP der VM und wurde bei jedem
    # Adresswechsel ungültig.

    - name: Keycloak realm-export.json aus Template rendern
      ansible.builtin.template:
        src: "{{ local_compose_path }}/keycloak/realm-export.json.j2"
        dest: "{{ project_root }}/keycloak/realm-export.json"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      vars:
        app_base_url: "{{ app_base_url_raw.stdout | trim }}"
        app_api_url: "{{ app_base_url_raw.stdout | trim }}/api"

    # Der NGINX_CONFIG_HASH-Trick entfällt: er existierte nur, weil Compose
    # eine inhaltliche Änderung an der bind-gemounteten nginx.conf nicht
    # bemerkt und der Container deshalb über ein Label-Drift neu erzeugt
    # werden musste. Der Caddyfile ist ebenso bind-gemountet, aber Caddy lädt
    # ihn über den Reload-Schritt am Playbook-Ende neu — validiert und ohne
    # Unterbrechung, statt den Container wegzuwerfen.

    - name: Log in to GHCR using credentials from the deployed .env
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          env_file="{{ project_root }}/.env"
          token=$(grep -E '^GIT_ACCESS_TOKEN=' "$env_file" 2>/dev/null | head -n1 | cut -d= -f2- | tr -d '\042\047\r' || true)
          user=$(grep -E '^GIT_USER=' "$env_file" 2>/dev/null | head -n1 | cut -d= -f2- | tr -d '\042\047\r' || true)
          if [ -z "$token" ]; then
            echo "no GIT_ACCESS_TOKEN in $env_file - skipping GHCR login"
            exit 0
          fi
          echo "$token" | docker login ghcr.io --username "${user:-x}" --password-stdin
        executable: /bin/bash
      changed_when: true

    - name: Pull alle Images
      ansible.builtin.shell:
        # --ignore-buildable überspringt Dienste mit build:-Abschnitt. Ohne das
        # versucht compose auch appstore-caddy:rfc2136 zu ziehen, das nur lokal
        # gebaut wird und in keiner Registry liegt - der Pull scheitert und
        # bricht das Playbook an dieser Stelle ab, noch bevor der Stack
        # überhaupt neu gestartet wird.
        cmd: docker compose -f docker-compose.staging.yml pull --ignore-buildable
        chdir: "{{ project_root }}"
      changed_when: true
      async: 600
      poll: 30

    - name: GHCR credentials aus root-Store entfernen
      ansible.builtin.file:
        path: /root/.docker/config.json
        state: absent

    # Validiert die zusammengesetzte Konfiguration, bevor das Modul übernimmt.
    # Der Schritt existiert nur wegen der Diagnose: docker_compose_v2 ruft
    # `compose images --format json` auf und liest ausschließlich stdout.
    # Bricht Compose ab — etwa weil eine ${VAR:?...}-Pflichtvariable in der .env
    # fehlt — steht die Erklärung auf stderr, stdout bleibt leer, und das Modul
    # meldet stattdessen "Expecting value: line 1 column 1 (char 0)". Diese
    # Meldung sagt nichts über die Ursache und hat schon einmal eine ganze
    # Fehlersuche in die falsche Richtung geschickt.
    #
    # `config -q` interpoliert dieselbe Datei, gibt bei Erfolg nichts aus und
    # nennt im Fehlerfall die betroffene Variable — Ansible zeigt stderr an.
    - name: Compose-Konfiguration validieren
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.staging.yml config -q
        chdir: "{{ project_root }}"
      changed_when: false

    - name: Start the application with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ project_root }}"
        files: ["docker-compose.staging.yml"]
        pull: never
        # Caddy wird gebaut statt gezogen (DNS-Modul einkompiliert). "always"
        # statt der Vorgabe, damit eine Änderung am Caddyfile oder Dockerfile
        # sicher im Image landet - die Layer sind gecacht, also kostet es nach
        # dem ersten Bau kaum Zeit.
        build: always
        state: present
      register: compose_output

    # Migrations live OUTSIDE the compose file on purpose: a previous
    # backend-migrate init container buried failure stderr inside the
    # compose JSON. Running alembic as its own playbook step surfaces
    # both the migration's exit code and its stderr directly in the
    # Ansible task output.
    - name: Wait for backend container to be running
      ansible.builtin.command: docker inspect -f '{% raw %}{{.State.Running}}{% endraw %}' backend-prod
      register: backend_running
      until: backend_running.stdout == "true"
      retries: 30
      delay: 2
      changed_when: false

    - name: Apply database migrations
      ansible.builtin.command: docker exec backend-prod python -m alembic upgrade head
      register: migration_result
      changed_when: "'Running upgrade' in migration_result.stdout"

    # Der Caddyfile ist bind-gemountet, Compose bemerkt eine inhaltliche
    # Änderung daran also nicht. Dieser Reload übernimmt sie. Caddy prüft die
    # Konfiguration dabei selbst und wechselt erst bei gültigem Ergebnis —
    # eine kaputte Datei legt den laufenden Proxy nicht lahm.
    #
    # Anders als beim früheren nginx-Label-Trick ist das kein Sicherheitsnetz,
    # sondern der einzige Weg, auf dem eine Konfigurationsänderung wirksam
    # wird. failed_when bleibt deshalb bewusst nicht auf false: schlägt der
    # Reload fehl, läuft der Proxy mit einer veralteten Konfiguration weiter,
    # und das soll auffallen.
    - name: Caddy-Konfiguration neu laden
      ansible.builtin.command:
        cmd: docker exec caddy-prod caddy reload --config /etc/caddy/Caddyfile
      register: caddy_reload
      changed_when: caddy_reload.rc == 0

    - name: Status der Deployment anzeigen
      ansible.builtin.debug:
        var: compose_output